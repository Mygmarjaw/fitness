<!DOCTYPE html>
<html lang="mn">
<head>
  <meta charset="UTF-8">
  <title>Нэвтрэх</title>
  <link rel="stylesheet" href="Нэвтрэх.css">
</head>
<body>
  <div class="login-box">
    <h2>Нэвтрэх</h2>
    <form>
      <div class="user-box">
        <input type="text" name="username" required>
        <label>Username</label>
      </div>
      <div class="user-box">
        <input type="password" name="password" required>
        <label>Password</label>
      </div>
      <button type="submit" class="animated-btn">
        <span></span><span></span><span></span><span></span>
        Нэвтрэх
      </button>
    
      <p class="signup-link">
        Та бүртгэлгүй юу? 
        <a href="Бүртгүүлэх.html">Бүртгүүлэх</a>
      </p>
    </form>    
  </div>
</body>
</html>
